workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Compute budget: the full suite (npm test) runs locally before every push to main,
# so CI only checks, builds and deploys. Browser tests are manual-only here.
stages: [build, test, deploy]
default:
  image: node:22-bookworm-slim
  interruptible: true

assemble:
  stage: build
  script:
    - npm ci --no-audit --no-fund
    - npm run check
    - npm run build
  artifacts:
    paths: [public/]
    expire_in: 1 day

browser:
  stage: test
  image: mcr.microsoft.com/playwright:v1.65.0-noble
  needs: [assemble]
  rules:
    - when: manual
      allow_failure: true
  script:
    - npm ci --no-audit --no-fund
    - npm run test:browser
  artifacts:
    when: always
    paths: [playwright-report/, test-results/]
    expire_in: 3 days

pages:
  stage: deploy
  interruptible: false
  resource_group: pages
  needs:
    - job: assemble
      artifacts: true
  script:
    - test -f public/index.html
  pages:
    publish: public
  artifacts:
    paths: [public/]
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
